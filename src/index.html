<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino-2 Client</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Using emoji icons for now, can replace with SVG/FontAwesome -->
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-card">
            <h1>Casino-2</h1>
            <form id="login-form">
                <input type="text" id="username" class="login-input" placeholder="Username" required />
                <input type="password" id="password" class="login-input" placeholder="Password" required />
                <button type="submit" class="btn-login">ENTER CASINO</button>
            </form>
            <div id="login-error" style="color: #e91e63; margin-top: 20px; font-size: 0.9rem;"></div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-screen" class="hidden">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="profile-summary">
                <div class="avatar">M</div>
                <div class="username" id="display-username">Player</div>
                <div class="balance-badge">
                    <span>$</span> <span id="display-balance">0.00</span>
                </div>
            </div>

            <ul class="nav-menu">
                <li class="nav-item active" data-target="profile-view">
                    <span class="nav-icon">📊</span> Profile
                </li>
                <li class="nav-item" data-target="games-view">
                    <span class="nav-icon">🎰</span> Games
                </li>
                <li class="nav-item" data-target="history-view">
                    <span class="nav-icon">📜</span> History
                </li>
                <li class="nav-item" id="logout-btn" style="margin-top: auto;">
                    <span class="nav-icon">🚪</span> Logout
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- PROFILE / STATS VIEW -->
            <div id="profile-view" class="active-view">
                <h2 class="page-title">Profile Statistics</h2>
                <div class="stats-grid">
                    <!-- Graph Area (User B) -->
                    <div class="chart-container">
                        <canvas id="balanceChart"></canvas>
                        <!-- User B needs to init Chart.js here -->
                    </div>
                    
                    <!-- Mini History List -->
                    <div class="history-mini-widget">
                        <h3 style="margin-bottom: 20px; font-size: 1rem; color: #b0bec5;">Recent Activity</h3>
                        <table style="font-size: 0.85rem;">
                             <tbody id="mini-history-body">
                                 <!-- JS Injected -->
                             </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- GAMES GRID VIEW -->
            <div id="games-view" class="hidden">
                <h2 class="page-title">Select Game</h2>
                <div class="games-grid">
                    <div class="game-card" data-game="slots">
                        <div class="game-icon">🍒</div>
                        <div class="game-title">Slots</div>
                    </div>
                    <div class="game-card" data-game="blackjack">
                        <div class="game-icon">♠️</div>
                        <div class="game-title">Blackjack (21)</div>
                    </div>
                    <div class="game-card" data-game="roulette">
                        <div class="game-icon">🔴</div>
                        <div class="game-title">Roulette</div>
                    </div>
                </div>
            </div>

            <!-- HISTORY VIEW -->
            <div id="history-view" class="hidden">
                <h2 class="page-title">Transaction History</h2>
                <div class="table-container">
                    <table id="history-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Game</th>
                                <th>Type</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- JS Injected -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- GAME OVERLAY (User B) -->
    <div id="game-container" class="game-overlay hidden">
        <div class="game-header">
            <span style="font-weight: bold;">Currently Playing</span>
            <button id="close-game" class="close-btn">Exit Game</button>
        </div>
        <div id="game-render-area">
            <!-- User B renders Slots/Cards here -->
        </div>
    </div>

    <script src="renderer.js" type="module"></script>
</body>
</html>
